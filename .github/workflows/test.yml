name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bfg
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: bibliography_fetch_grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bfg -d bibliography_fetch_grid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://bfg:change-me@localhost:5432/bibliography_fetch_grid
      TEST_DATABASE_URL: postgresql+psycopg://bfg:change-me@localhost:5432/bibliography_fetch_grid_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - run: docker compose up -d --build --wait

      - name: check /health
        run: |
          body=$(curl -sS http://localhost:8000/health)
          echo "$body"
          test "$body" = '{"status":"ok"}'

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down -v
