<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliography Fetch Grid</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1><a href="#">Bibliography Fetch Grid</a></h1>
    <a href="/docs">API docs</a>
  </header>

  <main>
    <form id="search">
      <label class="grow">
        Topic
        <input name="query" type="search" required maxlength="500" autofocus
               placeholder='e.g. "distributed systems" consensus'>
      </label>
      <label>
        From year
        <input name="from_year" type="number" min="1500" max="2100">
      </label>
      <label>
        To year
        <input name="to_year" type="number" min="1500" max="2100">
      </label>
      <label>
        Min citations
        <input name="min_citations" type="number" min="0">
      </label>
      <label>
        Papers
        <select name="limit">
          <option>25</option>
          <option>50</option>
          <option>100</option>
          <option>200</option>
          <option>300</option>
          <option>500</option>
        </select>
      </label>
      <label>
        Rank by
        <select name="sort">
          <option value="relevance">Relevance</option>
          <option value="citations_desc">Most cited</option>
          <option value="year_desc">Newest</option>
        </select>
      </label>
      <label>
        Repeat when saved
        <select name="schedule">
          <option value="">Don't repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>
      </label>
      <button type="submit">Search</button>
      <button id="save-search" class="secondary" type="button">Save search</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="results" hidden>
      <div class="toolbar" id="collection-bar" hidden>
        <h2 id="collection-name"></h2>
        <button id="rename-collection" type="button">Rename</button>
        <button id="delete-collection" type="button">Delete collection</button>
      </div>

      <div class="toolbar">
        <strong id="count"></strong>
        <input id="filter" type="search" placeholder="Filter by title, author or venue"
               aria-label="Filter results">
        <span class="exports">
          Export
          <a data-format="bibtex" download>BibTeX</a>
          <a data-format="ris" download>RIS</a>
          <a data-format="csv" download>CSV</a>
        </span>
      </div>

      <div class="toolbar">
        <span id="selected-count"></span>
        <select id="target" aria-label="Collection to add to"></select>
        <button id="add-selected" type="button">Add to collection</button>
        <button id="remove-selected" type="button">Remove from this collection</button>
      </div>

      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th><input id="select-all" type="checkbox" aria-label="Select all shown papers"></th>
              <th class="num"><button data-sort="rank">#</button></th>
              <th><button data-sort="title">Paper</button></th>
              <th class="num"><button data-sort="publication_year">Year</button></th>
              <th class="num"><button data-sort="cited_by_count">Citations</button></th>
              <th><button data-sort="work_type">Type</button></th>
              <th>Links</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section id="saved" hidden>
      <h2>Saved searches</h2>
      <ul id="saved-list" class="plain"></ul>
    </section>

    <section id="collections" hidden>
      <h2>Collections</h2>
      <ul id="collection-list" class="plain"></ul>
    </section>

    <section id="recent" hidden>
      <h2>Recent searches</h2>
      <ul id="recent-list" class="plain"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
